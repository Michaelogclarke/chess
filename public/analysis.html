<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis · Chess Online</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <nav id="nav" class="site-nav"></nav>
  <main class="game">
    <section class="board-col">
      <div class="player" id="top-player"><span class="name"></span></div>
      <div class="board-row">
        <div id="evalbar" class="evalbar" aria-hidden="true">
          <div class="evalfill"></div><span class="evaltext"></span>
        </div>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
          <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
          <div id="promo" class="promo" hidden></div>
        </div>
      </div>
      <div class="player" id="bottom-player"><span class="name"></span></div>
    </section>

    <aside class="side">
      <div class="card tabs-card">
        <div class="tabs" role="tablist">
          <button type="button" id="tab-analyse" class="on">Analyse</button>
          <button type="button" id="tab-play">Play vs Stockfish</button>
        </div>

        <div id="pane-analyse">
          <label class="toggle"><input type="checkbox" id="engine-on" checked>
            <span><strong>Stockfish</strong><span class="muted small" id="engine-info">Starting…</span></span></label>
          <ol id="lines" class="lines"></ol>
        </div>

        <div id="pane-play" hidden>
          <h3 class="small-h">Level</h3>
          <div class="chips" id="levels"></div>
          <h3 class="small-h">You play</h3>
          <div class="chips" id="vs-color">
            <button type="button" data-c="w" class="on">White</button>
            <button type="button" data-c="random">Random</button>
            <button type="button" data-c="b">Black</button>
          </div>
          <button type="button" id="vs-start" class="primary">Start game</button>
          <p id="vs-status" class="muted small"></p>
        </div>
      </div>

      <div id="status" class="card status" hidden></div>

      <div class="card moves-card">
        <ol id="moves" class="moves"></ol>
        <div class="nav">
          <button id="nav-first" aria-label="First move">⏮</button>
          <button id="nav-prev" aria-label="Previous move">◀</button>
          <span id="nav-pos" class="muted small"></span>
          <button id="nav-next" aria-label="Next move">▶</button>
          <button id="nav-last" aria-label="Last move">⏭</button>
        </div>
      </div>

      <div class="btns">
        <button id="flip">Flip</button>
        <button id="undo">Take back</button>
        <button id="reset">New board</button>
        <button id="load">Load PGN / FEN</button>
      </div>
      <p class="muted small">Stockfish is only available here and after games. It's switched off during live games against people.</p>
    </aside>
  </main>

  <dialog id="load-dialog" class="settings">
    <form method="dialog" class="settings-body">
      <div class="settings-head"><h2>Load a position</h2><button value="cancel" aria-label="Close">✕</button></div>
      <p class="muted small">Paste a list of moves (PGN, e.g. <code>1. e4 e5 2. Nf3</code>) or a FEN position.</p>
      <textarea id="load-text" rows="5" spellcheck="false"></textarea>
      <p id="load-err" class="error" hidden></p>
      <button value="load" class="primary">Load</button>
    </form>
  </dialog>

  <script type="module" src="/analysis.js"></script>
</body>
</html>
