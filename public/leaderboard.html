<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard · Chess Online</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <nav id="nav" class="site-nav"></nav>
  <main class="page">
    <h1>Leaderboard</h1>
    <div class="tabs" id="cats" role="tablist">
      <button type="button" data-c="bullet">Bullet</button>
      <button type="button" data-c="blitz">Blitz</button>
      <button type="button" data-c="rapid">Rapid</button>
      <button type="button" data-c="classical">Classical</button>
    </div>
    <div class="card">
      <table class="table" id="board">
        <thead><tr><th class="num">#</th><th>Player</th><th class="num">Rating</th><th class="num">Games</th><th class="num hide-sm">Won</th><th class="num hide-sm">Drawn</th><th class="num hide-sm">Lost</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="muted empty" hidden>No rated games in this category yet.</p>
      <p id="err" class="error" hidden></p>
    </div>
    <p class="muted small">A "?" means the rating is still provisional: the player hasn't played enough rated games for it to settle. Provisional players are listed after established ones.</p>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let category = new URLSearchParams(location.search).get('category') || 'blitz';

    async function load() {
      document.querySelectorAll('#cats button').forEach((b) => b.classList.toggle('on', b.dataset.c === category));
      history.replaceState(null, '', '/leaderboard?category=' + category);
      const tbody = $('board').querySelector('tbody');
      tbody.innerHTML = '';
      try {
        const res = await fetch('/api/leaderboard?category=' + category);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        data.players.forEach((p, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="num muted"></td><td><a></a></td><td class="num strong"></td>
            <td class="num"></td><td class="num hide-sm"></td><td class="num hide-sm"></td><td class="num hide-sm"></td>`;
          const td = tr.querySelectorAll('td');
          td[0].textContent = i + 1;
          const a = td[1].querySelector('a');
          a.textContent = p.username;
          a.href = '/u/' + encodeURIComponent(p.username);
          td[2].textContent = fmtRating(p);
          td[3].textContent = p.games;
          td[4].textContent = p.wins; td[5].textContent = p.draws; td[6].textContent = p.losses;
          tbody.appendChild(tr);
        });
        $('empty').hidden = data.players.length > 0;
        $('err').hidden = true;
      } catch (err) {
        $('err').textContent = 'Could not load the leaderboard. ' + (err.message || '');
        $('err').hidden = false;
      }
    }
    $('cats').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      category = b.dataset.c; load();
    });
    load();
  </script>
</body>
</html>
