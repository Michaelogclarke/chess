<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Online</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <nav id="nav" class="site-nav"></nav>

  <main class="game">
    <section class="board-col">
      <div class="player" id="top-player">
        <span class="dot"></span><span class="name"></span><span class="rating"></span><span class="diff"></span><span class="color"></span><span class="clock"></span>
      </div>
      <div class="board-row">
        <div id="evalbar" class="evalbar" hidden aria-hidden="true">
          <div class="evalfill"></div><span class="evaltext"></span>
        </div>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
          <svg id="shapes" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
          <svg id="arrows" class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
          <div id="promo" class="promo" hidden></div>
        </div>
      </div>
      <div class="player" id="bottom-player">
        <span class="dot"></span><span class="name"></span><span class="rating"></span><span class="diff"></span><span class="color"></span><span class="clock"></span>
      </div>
    </section>

    <aside class="side">
      <div id="invite" class="card" hidden>
        <strong>Invite a friend</strong>
        <p class="muted">Send them this link. The game starts when someone opens it.</p>
        <div class="copy">
          <input id="link" readonly>
          <button id="copy">Copy</button>
        </div>
      </div>

      <div id="status" class="card status"></div>
      <div id="notice" class="card notice" hidden></div>

      <div id="offer" class="card offer" hidden>
        <span id="offer-text"></span>
        <div class="btns">
          <button id="offer-yes" class="primary">Accept</button>
          <button id="offer-no">Decline</button>
        </div>
      </div>

      <div id="review" class="card review" hidden>
        <div class="review-head">
          <strong>Game review</strong>
          <button id="review-start" class="primary">Review with Stockfish</button>
        </div>
        <div id="review-progress" class="progress" hidden><div class="bar"></div><span class="muted small"></span></div>
        <table id="review-summary" class="review-summary" hidden>
          <thead><tr><th></th><th>Accuracy</th><th title="Brilliant moves">!!</th><th title="Inaccuracies">?!</th><th title="Mistakes">?</th><th title="Blunders">??</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="graph" class="graph" hidden></div>
        <p id="comment" class="comment" hidden></p>
      </div>

      <div class="card moves-card">
        <ol id="moves" class="moves"></ol>
        <div class="nav">
          <button id="nav-first" title="First move (Home)" aria-label="First move">⏮</button>
          <button id="nav-prev" title="Previous move (←)" aria-label="Previous move">◀</button>
          <span id="nav-pos" class="muted small"></span>
          <button id="nav-next" title="Next move (→)" aria-label="Next move">▶</button>
          <button id="nav-last" title="Latest move (End)" aria-label="Latest move">⏭</button>
        </div>
        <button id="nav-live" class="live-btn" hidden>Back to the game ▸</button>
      </div>

      <div class="btns">
        <button id="flip" title="Flip board">Flip</button>
        <button id="draw">Offer draw</button>
        <button id="resign">Resign</button>
        <button id="rematch" class="primary" hidden>Rematch</button>
      </div>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
